name: Tests and offline benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m groundlens evaluate --out-dir reports_ci
      - name: Assert reports generated
        run: python -c "from pathlib import Path; assert all((Path('reports_ci')/f).exists() for f in ('metrics.json','audit.jsonl','REPORT.md','retrieval_comparison.png'))"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-python-${{ matrix.python-version }}
          path: reports_ci/
